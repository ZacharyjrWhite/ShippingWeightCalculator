<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Shipping Calculator</h1>

        <!-- Controls -->
        <div class="row g-3">
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="country" class="form-label">Country:</label>
                    <input type="text" class="form-control bg-dark text-light" id="country" placeholder="Search or select a country">
                    <ul class="list-group position-absolute d-none bg-dark text-light" id="countryList" style="z-index: 1000; max-height: 200px; overflow-y: auto;">
                    </ul>
                </div>
                <div class="col-md-3 align-self-end">
                    <button id="refreshBtn" class="btn btn-primary w-100">Refresh</button>
                </div>
            </div>
            <div class="col-md-3">
                <label for="weightInterval" class="form-label">Weight Interval:</label>
                <select class="form-select bg-dark text-light" id="weightInterval">
                    <option selected>50g</option>
                    <option>100g</option>
                    <option>200g</option>
                    <option>500g</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="profitAddition" class="form-label">Profit Addition:</label>
                <input type="number" class="form-control bg-dark text-light" id="profitAddition" value="3">
            </div>
            <div class="col-md-3">
                <label for="shippingLine" class="form-label">Shipping Line:</label>
                <select class="form-select bg-dark text-light" id="shippingLine">
                    <!-- Options will be dynamically populated -->
                </select>
            </div>
        </div>

        <div class="form-check mt-4">
            <input class="form-check-input" type="checkbox" id="roundUp">
            <label class="form-check-label" for="roundUp">Round up to nearest .49 / .99?</label>
        </div>

        <!-- Table -->
        <div class="table-responsive mt-5">
            <table class="table table-dark table-bordered text-center shipping_data">
                <thead>
                    <tr>
                        <th>From (lb)</th>
                        <th>Up to and equal (lb)</th>
                        <th>Rate</th>
                        <th>Actual Cost</th>
                        <th>Our Profit</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- DATA -->
                </tbody>
            </table>
        </div>

        <!-- Export Button -->
        <div class="text-end mt-4">
            <button class="btn btn-primary csvDownload">Export .csv</button>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner-border text-warning" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="watermark">
        Made by: Zachary White -- zachary.jr.white@gmail.com
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
