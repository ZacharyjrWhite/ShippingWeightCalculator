<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .table thead th {
            color: #ffffff;
            border-bottom: 1px solid #444;
        }
        .table tbody tr {
            color: #dddddd;
        }
        .form-label {
            font-weight: bold;
        }
        .btn-primary {
            background-color: #1a73e8;
            border: none;
        }
        .btn-primary:hover {
            background-color: #185abc;
        }

        input:focus {
            outline: none !important;
            border:1px solid var(--bs-yellow);
            box-shadow: 0 0 10px var(--bs-yellow);
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Shipping Calculator</h1>

        <!-- Controls -->
        <div class="row g-3">
            <div class="col-md-3">
                <label for="country" class="form-label">Country:</label>
                <select class="form-select bg-dark text-light" id="country">
                    <option selected>US</option>
                    <option>Canada</option>
                    <option>UK</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="weightInterval" class="form-label">Weight Interval:</label>
                <select class="form-select bg-dark text-light" id="weightInterval">
                    <option selected>100g</option>
                    <option>200g</option>
                    <option>500g</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="profitAddition" class="form-label">Profit Addition:</label>
                <input type="text" class="form-control bg-dark text-light" id="profitAddition" value="$3">
            </div>
            <div class="col-md-3">
                <label for="shippingLine" class="form-label">Shipping Line:</label>
                <select class="form-select bg-dark text-light" id="shippingLine">
                    <option selected>Ordinary</option>
                    <option>Express</option>
                    <option>Priority</option>
                </select>
            </div>
        </div>

        <div class="form-check mt-4">
            <input class="form-check-input" type="checkbox" id="roundUp">
            <label class="form-check-label" for="roundUp">Round up to nearest .49 / .99?</label>
        </div>

        <!-- Table -->
        <div class="table-responsive mt-5">
            <table class="table table-dark table-bordered text-center">
                <thead>
                    <tr>
                        <th>From (lb)</th>
                        <th>Up to and equal (lb)</th>
                        <th>Rate</th>
                        <th>Actual Cost</th>
                        <th>Our Profit</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>0</td>
                        <td>0.22</td>
                        <td>$8.99</td>
                        <td>5.6</td>
                        <td>3.39</td>
                    </tr>
                    <tr>
                        <td>0.221</td>
                        <td>0.726</td>
                        <td>$8.99</td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>0.727</td>
                        <td>1.653</td>
                        <td>$9.99</td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>1.654</td>
                        <td>1.874</td>
                        <td>$15.99</td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>1.875</td>
                        <td>3.748</td>
                        <td>$23.99</td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>3.749</td>
                        <td>6.614</td>
                        <td>$36.99</td>
                        <td></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Export Button -->
        <div class="text-end mt-4">
            <button class="btn btn-primary">Export .csv</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="country_codes.js"></script>
    <script type="module" src="dropdown.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
