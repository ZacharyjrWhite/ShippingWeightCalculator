<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Global Dark Mode Styling */
        :root {
            --bs-dark-bg: #121212;
            --bs-dark-text: #ffffff;
            --bs-dark-border: #444;
            --bs-yellow: #ffc107; /* Define the yellow accent color */
        }
    
        body {
            background-color: var(--bs-dark-bg);
            color: var(--bs-dark-text);
        }
    
        /* Accent for Headings and Labels */
        h1, h2, h3, h4, h5, h6, .form-label {
            color: var(--bs-yellow);
        }
    
        /* Accent for Inputs, Textareas, and Selects */
        input, select, textarea {
            background-color: var(--bs-dark-bg);
            color: var(--bs-dark-text);
            border: 1px solid var(--bs-dark-border);
            transition: all 0.3s ease;
        }
    
        input:focus, select:focus, textarea:focus {
            border: 1px solid var(--bs-yellow);
            box-shadow: 0 0 10px var(--bs-yellow);
            outline: none;
            color: var(--bs-yellow);
        }
    
        input::placeholder {
            color: var(--bs-dark-border);
        }
    
        input:focus::placeholder {
            color: var(--bs-yellow);
        }
    
        /* Accent for Buttons */
        .btn-primary {
            background-color: var(--bs-yellow);
            border: none;
            color: var(--bs-dark-bg);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
    
        .btn-primary:hover {
            background-color: #e0a800; /* Slightly darker shade for hover */
            color: var(--bs-dark-bg);
        }
    
        /* Accent for Checkboxes and Radios */
        .form-check-input:checked {
            background-color: var(--bs-yellow);
            border-color: var(--bs-yellow);
        }
    
        .form-check-label {
            color: var(--bs-dark-text);
        }
    
        /* Table Styling */
        .table {
            background-color: var(--bs-dark-bg);
            color: var(--bs-dark-text);
        }
    
        .table thead th {
            color: var(--bs-yellow);
            border-bottom: 1px solid var(--bs-dark-border);
        }
    
        .table tbody tr {
            border-top: 1px solid var(--bs-dark-border);
        }
    
        .table tbody tr:hover {
            background-color: #1e1e1e; /* Slightly lighter shade for hover */
        }
    
        /* Dropdown Styling */
        #countryList {
            overflow-y: auto;
            border: 1px solid var(--bs-dark-border);
            max-height: 200px;
            background-color: var(--bs-dark-bg);
            color: var(--bs-dark-text);
            scrollbar-width: thin;
            scrollbar-color: var(--bs-dark-border) var(--bs-dark-bg);
        }
    
        #countryList::-webkit-scrollbar {
            width: 8px;
        }
    
        #countryList::-webkit-scrollbar-track {
            background: var(--bs-dark-bg);
        }
    
        #countryList::-webkit-scrollbar-thumb {
            background: var(--bs-dark-border);
            border-radius: 4px;
        }
    
        #countryList::-webkit-scrollbar-thumb:hover {
            background: var(--bs-yellow);
        }
    
        /* Links and Text Accents */
        a, a:hover, a:focus {
            color: var(--bs-yellow);
            text-decoration: none;
        }
    
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Shipping Calculator</h1>

        <!-- Controls -->
        <div class="row g-3">
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="country" class="form-label">Country:</label>
                    <input type="text" class="form-control bg-dark text-light" id="country" placeholder="Search or select a country">
                    <ul class="list-group position-absolute d-none bg-dark text-light w-100" id="countryList" style="z-index: 1000; max-height: 200px; overflow-y: auto;">
                    </ul>
                </div>
                <div class="col-md-3 align-self-end">
                    <button id="refreshBtn" class="btn btn-primary w-100">Refresh</button>
                </div>
            </div>
            <div class="col-md-3">
                <label for="weightInterval" class="form-label">Weight Interval:</label>
                <select class="form-select bg-dark text-light" id="weightInterval">
                    <option selected>100g</option>
                    <option>200g</option>
                    <option>500g</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="profitAddition" class="form-label">Profit Addition:</label>
                <input type="text" class="form-control bg-dark text-light" id="profitAddition" value="$3">
            </div>
            <div class="col-md-3">
                <label for="shippingLine" class="form-label">Shipping Line:</label>
                <select class="form-select bg-dark text-light" id="shippingLine">
                    <option selected>Ordinary</option>
                    <option>Express</option>
                    <option>Priority</option>
                </select>
            </div>
        </div>

        <div class="form-check mt-4">
            <input class="form-check-input" type="checkbox" id="roundUp">
            <label class="form-check-label" for="roundUp">Round up to nearest .49 / .99?</label>
        </div>

        <!-- Table -->
        <div class="table-responsive mt-5">
            <table class="table table-dark table-bordered text-center shipping_data">
                <thead>
                    <tr>
                        <th>From (lb)</th>
                        <th>Up to and equal (lb)</th>
                        <th>Rate</th>
                        <th>Actual Cost</th>
                        <th>Our Profit</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>0</td>
                        <td>0.22</td>
                        <td>$8.99</td>
                        <td>5.6</td>
                        <td>3.39</td>
                    </tr>
                    <tr>
                        <td>0.221</td>
                        <td>0.726</td>
                        <td>$8.99</td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>0.727</td>
                        <td>1.653</td>
                        <td>$9.99</td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>1.654</td>
                        <td>1.874</td>
                        <td>$15.99</td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>1.875</td>
                        <td>3.748</td>
                        <td>$23.99</td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>3.749</td>
                        <td>6.614</td>
                        <td>$36.99</td>
                        <td></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Export Button -->
        <div class="text-end mt-4">
            <button class="btn btn-primary csvDownload">Export .csv</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="country_codes.js"></script>
    <script type="module" src="dropdown.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
